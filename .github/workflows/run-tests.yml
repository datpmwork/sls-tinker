name: Tests

on: [push, pull_request]

jobs:
  # Test with Bref platform
  test-bref:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ 8.1, 8.2, 8.3, 8.4 ]
        laravel: [ 10.*, 11.*, 12.*, 13.* ]
        bref: [ 2, 3 ]
        stability: [ prefer-stable ]
        exclude:
          # Laravel 11 requires PHP 8.2+
          - laravel: 11.*
            php: 8.1
          # Laravel 12 requires PHP 8.2+
          - laravel: 12.*
            php: 8.1
          # Laravel 13 requires PHP 8.3+
          - laravel: 13.*
            php: 8.1
          - laravel: 13.*
            php: 8.2
          # Bref 3 requires PHP 8.2+
          - bref: 3
            php: 8.1

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - bref${{ matrix.bref }}

    steps:
      - name: Checkout package code
        uses: actions/checkout@v7

      - name: Run tests
        uses: ./.github/actions/test-action
        with:
          php-version: ${{ matrix.php }}
          laravel-version: ${{ matrix.laravel }}
          bref-version: ${{ matrix.bref }}
          platform: bref

  # Test with Vapor platform
  test-vapor:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ 8.1, 8.2, 8.3, 8.4 ]
        laravel: [ 10.*, 11.*, 12.* ]
        stability: [ prefer-stable ]
        exclude:
          # Laravel 11 requires PHP 8.2+
          - laravel: 11.*
            php: 8.1

          # Laravel 12 requires PHP 8.2+
          - laravel: 12.*
            php: 8.1

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - vapor

    steps:
      - name: Checkout package code
        uses: actions/checkout@v7

      - name: Run tests
        uses: ./.github/actions/test-action
        with:
          php-version: ${{ matrix.php }}
          laravel-version: ${{ matrix.laravel }}
          platform: vapor
